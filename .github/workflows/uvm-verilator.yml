name: UVM on Verilator + cycle-accurate cross-check

# Builds UVM-capable Verilator from source (the apt Verilator can't elaborate
# UVM), lints + runs the SV UVM env (--binary), runs the PyUVM tier, and then
# proves the two testbenches track cycle-for-cycle (tools/trace_compare.py).
# This project does NOT use OSS CAD Suite.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VERILATOR_REF: v5.050
  VERILATOR_PREFIX: /home/runner/verilator-install

jobs:
  uvm-verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Verilator install
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ${{ env.VERILATOR_PREFIX }}
          key: ${{ runner.os }}-verilator-${{ env.VERILATOR_REF }}-uvm

      - name: Build UVM-capable Verilator (on cache miss)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git help2man perl python3 make autoconf g++ flex bison ccache \
            libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev \
            zlib1g zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_REF" \
            https://github.com/verilator/verilator verilator-src
          cd verilator-src
          autoconf && ./configure --prefix="$VERILATOR_PREFIX"
          make -j"$(nproc)" && make install
          # Keep the bundled Accellera UVM lib beside the install (survives cache).
          mkdir -p "$VERILATOR_PREFIX/uvm"
          cp -a test_regress/t/uvm/. "$VERILATOR_PREFIX/uvm/"

      - name: Put Verilator on PATH + ensure ccache
        run: |
          echo "$VERILATOR_PREFIX/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y ccache z3

      - name: Lint SV UVM env (elaborate-only)
        run: |
          make lint-uvm \
            VERILATOR="$VERILATOR_PREFIX/bin/verilator" \
            UVM_HOME="$VERILATOR_PREFIX/uvm"

      - name: Build + run SV UVM env (--binary, UVM_ERROR-gated)
        run: |
          make uvm \
            VERILATOR="$VERILATOR_PREFIX/bin/verilator" \
            UVM_HOME="$VERILATOR_PREFIX/uvm" \
            BUILD_JOBS="$(nproc)"

      # PyUVM tier uses the from-source Verilator 5.050 already on PATH (cocotb
      # 2.x requires >= 5.036). This produces the PyUVM trace for the cross-check.
      - name: Install cocotb/pyuvm for the PyUVM tier
        run: pip install --break-system-packages cocotb pyuvm

      - name: PyUVM tier
        run: make pyuvm

      - name: Cycle-accurate cross-check (PyUVM trace == UVM trace)
        run: make trace-compare

      - name: Upload traces + UVM log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvm-verilator-traces
          path: |
            dv/pyuvm/build/bridge.trace
            dv/uvm/vlt/obj/bridge.trace
            dv/uvm/vlt/obj/run.log
          retention-days: 7
          if-no-files-found: ignore

      # Additive formal tier (Phase F increment 3, SymbiYosys BMC). Strictly
      # POST-GATE: placed after trace-compare and its artifact upload so it can
      # never perturb lint/pyuvm/fcov/uvm/trace-compare. Reads no testbench and
      # touches no rtl/dv file. z3 is already installed above; add yosys + the
      # click module + SymbiYosys itself (shallow git clone, `make install` is
      # a pure-Python copy -- no compile). NOT OSS CAD Suite. This must PASS.
      - name: Install SymbiYosys formal tools (yosys, sby, click)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y yosys
          pip install --break-system-packages click
          git clone --depth 1 https://github.com/YosysHQ/sby /tmp/sby
          sudo make -C /tmp/sby install
          rm -rf /tmp/sby

      - name: Formal BMC (SymbiYosys, post-gate)
        run: make formal

      # Additive, advisory line-coverage report (Phase F increment 2). Runs the
      # SAME from-source Verilator + cocotb/pyuvm already on PATH/installed above,
      # in a separate instrumented build dir, so it cannot perturb the gate. Must
      # run AFTER trace-compare: `make coverage` re-runs the pyuvm round-trip and
      # rewrites dv/pyuvm/build/bridge.trace with identical content, so ordering
      # it any earlier would just be redundant, not unsafe, but this keeps the
      # cross-check unambiguously first. Non-gating: no COV_MIN.
      - name: RTL line coverage (advisory, make coverage)
        # ADVISORY: a hiccup in the instrumented build must never red the job
        # that guards the --binary UVM run and the cross-check above it.
        continue-on-error: true
        run: |
          make coverage \
            VERILATOR="$VERILATOR_PREFIX/bin/verilator" \
            VERILATOR_COVERAGE="$VERILATOR_PREFIX/bin/verilator_coverage"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-coverage
          path: |
            build/coverage/coverage.txt
            build/coverage/annotated
          retention-days: 7
          if-no-files-found: ignore

      # Additive DV metrics + dashboard (Phase F increment 4). LAST step in the
      # job: strictly POST-GATE, after the --binary UVM run, trace-compare and
      # the coverage steps, so it can never perturb the byte-identical
      # cross-check. ADVISORY (continue-on-error) — a metrics hiccup must never
      # red the job that guards the gate. The collector re-runs only the cheap
      # tiers; `uvm` is NOT rebuilt, its result is read from the run.log the
      # gate already wrote, and `trace-compare` re-diffs the traces on disk.
      # Tiers whose tools are absent are recorded 'not-run', never 'fail'.
      - name: DV metrics row (advisory, post-gate)
        continue-on-error: true
        run: |
          make metrics \
            METRICS_TIERS=lint,pyuvm,fcov,coverage,formal,trace-compare \
            METRICS_ARGS="--env ci \
              --make-arg VERILATOR=$VERILATOR_PREFIX/bin/verilator \
              --make-arg VERILATOR_COVERAGE=$VERILATOR_PREFIX/bin/verilator_coverage"
          make dashboard

      - name: Upload metrics dashboard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dv-metrics-dashboard
          path: |
            metrics/dashboard.html
            metrics/metrics.db
          retention-days: 7
          if-no-files-found: ignore
