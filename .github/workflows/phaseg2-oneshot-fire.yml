name: Phase G inc2 one-shot swarm fire

# ONE-SHOT, self-guarded scheduled fire of the DV swarm for Phase G increment 2.
#
# Why this exists: the swarm must be fired at the START of a fresh subscription
# session window (windows reset ~04:30 / 09:30 / 14:30 / 19:30 UTC) — a fire near
# a window's cap dies ~6-9 min in with no branch pushed. A local session-only cron
# cannot fire this unattended (it needs the maintainer's terminal open), so the
# schedule lives here on GitHub's infra instead.
#
# It is guarded to ACT ONLY on the target UTC date (2026-09-03); every later day it
# no-ops. It runs the swarm by CALLING swarm.yml as a reusable workflow (secrets:
# inherit) — no cross-workflow dispatch token needed. docker/swarm-task.md on main
# already points the blank-task swarm at increment 2 (commit c0b5152).
#
# DELETE THIS FILE after the increment-2 fire has landed (it is single-use).

on:
  schedule:
    # 04:32 UTC — just inside the ~04:30 UTC window reset (off the :00/:30 marks).
    - cron: "32 4 * * *"
  workflow_dispatch: {}   # manual override / test (bypasses the date guard)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dv-swarm-oneshot
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
    steps:
      - id: d
        run: |
          today="$(date -u +%F)"
          echo "today (UTC) = $today"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — firing regardless of date"
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$today" = "2026-09-03" ]; then
            echo "target date matched — firing the increment-2 swarm"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "one-shot window is past ($today != 2026-09-03) — no-op. DELETE this workflow."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  fire:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    uses: ./.github/workflows/swarm.yml
    secrets: inherit
    with:
      task: ""
      provider: anthropic
