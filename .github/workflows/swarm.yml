name: DV swarm

# Manual "Run workflow" button that runs the headless DV swarm (swarm-manager →
# per-tier dv-env-testers + infra-agent) on a GitHub runner: it runs each DV tier,
# fixes what is red, and opens a PR. CI (uvm-verilator.yml) validates the
# authoritative --binary UVM + byte-identical trace_compare on that PR.
# See docs/phase_d_swarm.md.
#
# Requires repo/environment secrets:
#   ANTHROPIC_API_KEY        Claude Console key (sk-ant-api…), OR
#   CLAUDE_CODE_OAUTH_TOKEN  subscription token (sk-ant-oat…, `claude setup-token`)
#   KIMI_API_KEY             (provider=kimi only)
#   SWARM_GITHUB_TOKEN       (optional) PAT with contents:write + pull-requests:write
#                            so the PR it opens DOES trigger CI; falls back to
#                            the built-in GITHUB_TOKEN (whose PRs do not trigger CI).

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the swarm (blank = the default finalization task)"
        required: false
        default: ""
      max_parallel:
        description: "Max DV tiers in parallel (blank = auto-size to RAM)"
        required: false
        default: ""
      provider:
        description: "Model provider"
        required: false
        default: "anthropic"
        type: choice
        options: [ anthropic, kimi ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dv-swarm
  cancel-in-progress: false

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install RTL tools (apt Verilator + Icarus; NOT OSS CAD Suite)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator iverilog
          verilator --version | head -1
          iverilog -V | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cocotb + cocotb_coverage + pyuvm (fcov/pyuvm tiers)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cocotb==1.9.2" "cocotb_coverage==1.2.0" "pyuvm==4.0.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the DV swarm
        env:
          SWARM_MODEL_PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.SWARM_GITHUB_TOKEN || github.token }}
          # Author the swarm's commits as the triggering user so the branch's CI
          # is not held as action_required.
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          SWARM_MAX_PARALLEL: ${{ inputs.max_parallel }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: bash docker/swarm.sh "${{ inputs.task }}"
