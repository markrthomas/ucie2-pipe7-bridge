name: prebuild verilator-uvm image

# The prebuild: build the from-source UVM-capable Verilator image (root
# Dockerfile) ONCE and publish it to GHCR so every consumer — the Railway cloud
# swarm, the CI uvm-verilator job, Codespaces — pulls a hot image instead of
# rebuilding Verilator from source.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'rtl/**'
      - 'dv/uvm/**'
      - '.github/workflows/prebuild-image.yml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Only actions/checkout@v5 (Node 24). Build+push via the docker CLI that is
      # preinstalled on the runner — avoids the docker/* actions that still
      # declare Node 20 and trip the deprecation warning.
      - uses: actions/checkout@v5

      - name: Build and push to GHCR (latest + sha tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ucie2-pipe7-uvm"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f Dockerfile -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

      # The image above contains this repo's source (COPY . /work), so it stays PRIVATE.  Railway needs a PUBLIC
      # base image (it cannot pull a private one during a build), so publish the toolchain on its own - the
      # `tools` stage: Verilator + UVM, z3, yosys, sby, no repo source - for docker/Dockerfile.railway.
      - name: Build and push the source-free toolchain image (tools-main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOOLS="ghcr.io/${GITHUB_REPOSITORY,,}/dv-tools"
          docker build -f Dockerfile --target tools -t "$TOOLS:tools-main" -t "$TOOLS:tools-$GITHUB_SHA" .
          docker push "$TOOLS:tools-main"
          docker push "$TOOLS:tools-$GITHUB_SHA"
